<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/stylesheets/sus_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="../assets/codescripts/background.js" defer></script>
    <script src="../assets/codescripts/role.js" defer></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Caveat:wght@400..700&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <title>The Suspect</title>
</head>

<body>
    <div class="title-box">
        <h1>Suspect</h1>
    </div>
    <!-- This is the main box under Suspect title box -->
    <div class="items">
        <div class="module-container">
            <select id="the_module">
                <option value="small_talk">Small Talk</option>
                <option value="creative_problem">Creative Problem Solving</option>
                <option value="imagination">Imagination</option>
            </select>
        </div>
        <div class="theContainer">

            <div class="background-div">
                <button id="background-button">Background</button>
                <div class="background-box">
                    <img src="" alt="" id="resultBackground" style="display: none;">
                </div>
            </div>

            <div class="role-div">
                <button id="role-button">Role</button>
                <div class="role-box">
                    <img src="" alt="" id="resultRole" style="display: none;">
                </div>
            </div>


        </div>

    </div>
</body>

</html>
