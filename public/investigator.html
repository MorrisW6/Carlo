<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Investigator</title>
    <script src="../assets/codescripts/penalty.js" defer></script>
    <script src="../assets/codescripts/module.js" defer></script>
    <link rel="stylesheet" href="../assets/stylesheets/inv_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Caveat:wght@400..700&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="title-box">
        <h1>Investigator</h1>
    </div>

    <div class="items">
        <div class="head-container">
            <button id="penalty">Choose Penalty</button>
            <div id="image-box">
                <img src="" alt="" id="resultImage" style="display: none;">
            </div>
            <select id="the_module">
                <option value="small_talk">Small Talk</option>
                <option value="creative_problem">Creative Problem Solving</option>
                <option value="imagination">Imagination</option>
                <option value="hopes">Hopes & Dreams</option>
            </select>
            <div id="intro-box">
                <img src="../assets/images/small_talk/investigator_cards/intro1.png" alt="" id="intro-image">
            </div>
        </div>
        <div class="module-box">
            <h3>Primary Questions</h3>
            <div class="primary-container">
                <img src="../assets/images/small_talk/investigator_cards/primary1.png" alt="" id="primary1">
                <img src="../assets/images/small_talk/investigator_cards/primary2.png" alt="" id="primary2">
                <img src="../assets/images/small_talk/investigator_cards/primary3.png" alt="" id="primary3">
            </div>
            <h3>Secondary Questions</h3>
            <div class="secondary-container">
                <img src="../assets/images/small_talk/investigator_cards/secondary1.png" alt="" id="secondary1">
                <img src="../assets/images/small_talk/investigator_cards/secondary2.png" alt="" id="secondary2">
                <img src="../assets/images/small_talk/investigator_cards/secondary3.png" alt="" id="secondary3">
            </div>

        </div>
    </div>

</body>

</html>
